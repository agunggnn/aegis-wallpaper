[package]
name = "aegis-wallpaper"
version = "0.1.0"
edition = "2021"
authors = ["Aegis Fleet <agung@aegis.dev>"]
description = "Sovereign Windows Live Wallpaper Engine and Native MCP Server"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
walkdir = "2.5"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
